openapi: 3.0.3
info:
  title: IT Center Feedback & Issue Reporting API
  version: 1.0.0
  description: |
    Phase 7 Feedback & Issue Reporting API with JWT authentication, RBAC, S3 file uploads, 
    AWS Comprehend sentiment analysis, Teams notifications, and CSV export.
    
    **Authentication**: JWT tokens from AWS Cognito
    **Authorization**: Role-based access control (ADMIN, EMPLOYEE)
servers:
  - url: http://localhost:8086
    description: Local development
  - url: https://api-dev.itcenter.com
    description: Development environment
  - url: https://api.itcenter.com
    description: Production environment
security:
  - bearerAuth: []
paths:
  /api/v1/healthz:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags:
        - System
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/feedback:
    post:
      summary: Create feedback
      operationId: createFeedback
      tags:
        - Feedback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackRequest'
      responses:
        '201':
          description: Feedback created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      summary: List feedback
      operationId: listFeedback
      tags:
        - Feedback
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, REJECTED]
        - name: assignee
          in: query
          schema:
            type: integer
            description: User ID of assignee
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, URGENT]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/feedback/{id}:
    get:
      summary: Get feedback details
      operationId: getFeedback
      tags:
        - Feedback
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feedback ID
      responses:
        '200':
          description: Feedback details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update feedback (ADMIN only)
      operationId: updateFeedback
      tags:
        - Feedback
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feedback ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeedbackRequest'
      responses:
        '200':
          description: Feedback updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/feedback/{id}/messages:
    post:
      summary: Add message to feedback
      operationId: addMessage
      tags:
        - Feedback
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feedback ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMessageRequest'
      responses:
        '201':
          description: Message added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackMessage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/feedback/{id}/analyze:
    post:
      summary: Queue sentiment analysis (ADMIN only)
      operationId: analyzeFeedback
      tags:
        - Feedback
        - Admin
        - Integrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feedback ID
      responses:
        '200':
          description: Sentiment analysis queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sentiment analysis queued
                  feedback_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/exports/feedback.csv:
    get:
      summary: Export feedback as CSV (ADMIN only)
      operationId: exportFeedbackCsv
      tags:
        - Feedback
        - Admin
        - Export
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, REJECTED]
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, URGENT]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="feedback_export_2025-01-01.csv"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integrations/teams/notify:
    post:
      summary: Queue Teams notification (ADMIN only)
      operationId: sendTeamsNotification
      tags:
        - Integrations
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - feedback_id
              properties:
                feedback_id:
                  type: string
                  format: uuid
                  description: Feedback ID to notify about
                channel_id:
                  type: string
                  nullable: true
                  description: Optional Teams channel ID
      responses:
        '200':
          description: Teams notification queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Teams notification queued
                  feedback_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from AWS Cognito

  schemas:
    Feedback:
      type: object
      properties:
        feedback_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          maxLength: 50
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, REJECTED]
        created_by:
          type: integer
          description: User ID of creator
        assigned_to:
          type: integer
          nullable: true
          description: User ID of assignee
        labels:
          type: array
          items:
            type: string
            maxLength: 50
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FeedbackDetail:
      allOf:
        - $ref: '#/components/schemas/Feedback'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/FeedbackMessage'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/FeedbackAttachment'
            audit_logs:
              type: array
              items:
                $ref: '#/components/schemas/FeedbackAudit'
            nlp_analysis:
              type: array
              items:
                $ref: '#/components/schemas/NlpAnalysis'

    FeedbackMessage:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        feedback_id:
          type: string
          format: uuid
        user_id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackAttachment'

    FeedbackAttachment:
      type: object
      properties:
        attachment_id:
          type: string
          format: uuid
        feedback_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
          nullable: true
        s3_key:
          type: string
          maxLength: 500
        file_name:
          type: string
          maxLength: 255
        file_size:
          type: integer
          minimum: 0
        mime_type:
          type: string
          maxLength: 100
        uploaded_by:
          type: integer
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri
          description: Presigned S3 download URL (generated on demand)

    FeedbackAudit:
      type: object
      properties:
        audit_id:
          type: integer
        feedback_id:
          type: string
          format: uuid
        user_id:
          type: integer
          nullable: true
        action:
          type: string
          description: Action performed (e.g., CREATED, UPDATED, STATUS_CHANGED)
        old_value:
          type: object
          nullable: true
          additionalProperties: true
        new_value:
          type: object
          nullable: true
          additionalProperties: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    NlpAnalysis:
      type: object
      properties:
        analysis_id:
          type: string
          format: uuid
        feedback_id:
          type: string
          format: uuid
        sentiment:
          type: string
          enum: [POSITIVE, NEGATIVE, NEUTRAL, MIXED]
          nullable: true
        sentiment_score:
          type: object
          nullable: true
          additionalProperties:
            type: number
            format: float
        pii_entities:
          type: array
          nullable: true
          items:
            type: object
            properties:
              type:
                type: string
              score:
                type: number
                format: float
              text:
                type: string
        raw_response:
          type: object
          nullable: true
          additionalProperties: true
        analyzed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateFeedbackRequest:
      type: object
      required:
        - title
        - description
        - category
      properties:
        title:
          type: string
          maxLength: 200
          example: Application crashes on startup
        description:
          type: string
          example: The application crashes immediately after launching on Windows 10.
        category:
          type: string
          maxLength: 50
          example: BUG
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          default: MEDIUM
        labels:
          type: array
          items:
            type: string
            maxLength: 50
          example: [urgent, windows, crash]
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInput'

    UpdateFeedbackRequest:
      type: object
      properties:
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, REJECTED]
        assignee_id:
          type: integer
          description: User ID to assign feedback to
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        labels:
          type: array
          items:
            type: string
            maxLength: 50

    AddMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: This issue has been resolved in the latest version.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInput'

    AttachmentInput:
      type: object
      required:
        - file_name
        - s3_key
      properties:
        file_name:
          type: string
          maxLength: 255
          example: screenshot.png
        file_size:
          type: integer
          minimum: 0
          example: 102400
        mime_type:
          type: string
          maxLength: 100
          example: image/png
        s3_key:
          type: string
          maxLength: 500
          example: feedback/attachments/abc123/screenshot.png

    FeedbackListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        message:
          type: string
          description: Detailed error message (optional)

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthenticated:
      description: Unauthenticated - Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              error: Unauthenticated
              message: Missing or invalid authentication token

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              error: Forbidden
              message: You do not have permission to perform this action

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              error: Not found
              message: Feedback not found

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
            example:
              message: The given data was invalid.
              errors:
                title:
                  - The title field is required.
                category:
                  - The category field is required.

