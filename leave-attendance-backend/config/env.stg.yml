allowedOrigins:
  - https://stg-admin.example.com
  - https://stg-flutter.example.com

vpc:
  subnetIds:
    - subnet-aaaaaaaa
    - subnet-bbbbbbbb
  securityGroupIds:
    - sg-cccccccc

database:
  host: itcenter-stg.cfeacycaqhdx.ap-southeast-2.rds.amazonaws.com
  port: 5432
  user: postgres
  password: password
  name: itcenter_auth
  ssl: true
  poolMax: 10

# Phase 1 database connection (for syncing users from app_users table)
# If Phase 1 and Phase 2 use the same database, use the same connection details
phase1Database:
  host: itcenter-stg.cfeacycaqhdx.ap-southeast-2.rds.amazonaws.com
  port: 5432
  user: postgres
  password: password
  name: itcenter_auth
  ssl: true

cognito:
  region: ap-southeast-2
  userPoolId: ap-southeast-2_stgPool
  clientId: stgClientIdPlaceholder

# Auth service configuration (for fetching user details from auth-backend)
authService:
  url: https://stg-auth.example.com  # Update with actual staging auth backend URL
  timeout: 5000  # Request timeout in milliseconds

graph:
  tenant: stg-tenant-id
  clientId: stg-graph-client-id
  clientSecret: stg-graph-client-secret
  scope: https://graph.microsoft.com/.default

featureFlags:
  geoValidationEnabled: false
  calendarSyncEnabled: true

calendarSync:
  visibilityTimeout: 60
  maxReceiveCount: 3

provisionedConcurrency:
  clockIn: 0
  clockOut: 0

