    - subnet-prod-1111
    - subnet-prod-2222
  securityGroupIds:
    - sg-prod-3333

database:
  host: itcenter-prd.cfeacycaqhdx.ap-southeast-2.rds.amazonaws.com
  port: 5432
  user: postgres
  password: password
